name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # package.json requires Node >=22.13.0.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Repo-wide. Generated shadcn components under components/ui/** are declared in
      # .oxlintrc.json's ignorePatterns, because hand-fixes there are lost the next time
      # the CLI regenerates them. Their 18 remaining findings are jsx-a11y and style nits
      # inside that vendored code; `tsc --noEmit` above still typechecks it, so the
      # application code that imports it is not exempt from correctness checks.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: node scripts/test.mjs

      # Catches breakage that typechecking alone misses, e.g. a route that
      # fails to compile under the Cloudflare/vinext build.
      - name: Production build
        run: npm run build
